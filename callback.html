<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login Callback — Hermes OS</title>
    <meta name="description" content="TikTok Login Kit OAuth callback handler for Hermes OS.">
    <style>
        :root {
            --slate-bg: #0a0f17;
            --slate-card: #131a26;
            --slate-border: #2a3548;
            --red-string: #e63946;
            --typewriter: #e9ece9;
            --scan-gray: #8a95a8;
            --accent-blue: #4a90d9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--slate-bg);
            color: var(--typewriter);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: var(--slate-card);
            border: 1px solid var(--slate-border);
            border-radius: 6px;
            padding: 2rem;
            text-align: center;
            max-width: 500px;
            margin: 1rem;
        }
        .card h1 {
            color: var(--typewriter);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--slate-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--slate-border);
            color: var(--scan-gray);
            font-size: 0.85rem;
        }
        .footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ TikTok Login Successful</h1>
        <p id="status">Processing your TikTok login...</p>
        <p style="margin-top: 1rem;"><span class="spinner"></span></p>
    </div>

    <script>
        const WORKER = 'https://hermes-tiktok-webhook.matthew-mickens1.workers.dev';
        const DEMO = 'https://allmatt7.github.io/planet-allmatt-tier0-landing/sandbox-demo.html';
        const params = new URLSearchParams(window.location.search);

        async function completeLogin() {
            const providerError = params.get('error_description') || params.get('error');
            const code = params.get('code');
            const state = params.get('state');
            if (providerError) throw new Error(providerError);
            if (!code || !state) throw new Error('TikTok did not return a complete authorization code and state.');

            const response = await fetch(WORKER + '/oauth/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state), {
                headers: { 'Accept': 'application/json' },
            });
            const result = await response.json();
            if (!response.ok || result.status !== 'connected' || !result.connection_id) {
                throw new Error(result.provider_error || result.error || 'TikTok account verification did not complete.');
            }

            // Only the opaque Hermes connection ID reaches browser storage.
            localStorage.removeItem('tiktok_auth_payload');
            localStorage.setItem('tiktok_connection_id', result.connection_id);
            document.getElementById('status').innerText = 'Connected. TikTok tokens are stored securely by Hermes.';
            const next = new URL(DEMO);
            next.searchParams.set('connection_id', result.connection_id);
            setTimeout(() => window.location.replace(next.toString()), 700);
        }

        completeLogin().catch(error => {
            document.querySelector('.card h1').innerText = 'TikTok connection failed';
            document.getElementById('status').innerText = error.message;
            document.querySelector('.spinner').style.display = 'none';
        });
    </script>

    <div class="card footer">
        <p>Hermes OS — TikTok Login Kit Callback</p>
        <p><a href="https://allmatt7.github.io/planet-allmatt-tier0-landing/terms.html">Terms of Service</a> | <a href="https://allmatt7.github.io/planet-allmatt-tier0-landing/privacy.html">Privacy Policy</a></p>
    </div>
</body>
</html>
